# Las pruebas Robolectric usan una Application plana: `isIncludeAndroidResources`
# (RF-45, assets de PdfBox-Android para el escritor del PDF) haría que Robolectric
# instanciara AuroraApplication y con ella el grafo de Hilt (Firestore real).
# Ningún test de la JVM necesita ese grafo: todos construyen sus colaboradores.
application=android.app.Application
