[versions]
agp = "8.8.0"
kotlin = "2.0.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
# compose-bom 2025.02.00 -> foundation/ui 1.7.8. Se sube desde 2024.04.01 para
# llevarse el arreglo del NPE de LegacyCursorAnchorInfoController, que entró en
# foundation 1.7.4 (verificado contra los fuentes de Maven: 1.7.2 y 1.7.3 no lo
# tienen, 1.7.4 en adelante sí). El salto real es de 1.7.2 a 1.7.8, porque
# navigation-compose 2.8.9 ya elevaba el BOM viejo a 1.7.2. Se queda en la línea
# 1.7.x a propósito: 1.8.x obligaría a revisar el emparejamiento con Kotlin 2.0,
# el mismo motivo por el que el BOM de Firebase está fijado en 33.16.0.
# Hallazgo H-2 de la evaluación OWASP (P-90).
#
# El BOM arrastra además **material3 de 1.2.1 a 1.3.1** (verificado en el árbol de
# `releaseRuntimeClasspath`): no es solo foundation/ui. No abre superficie —el
# manifiesto fusionado del release cambia en una sola línea, la de H-5, y el APK
# crece 804 B— pero sí cambia métricas y colores por defecto de componentes que la
# app usa: DatePicker, Checkbox, Switch, CircularProgressIndicator y los campos del
# kit. De ahí el paso §8-S6 de verificación visual. Peso y gama baja (A2-1): sin
# dependencias nuevas, +804 B sobre 23,95 MB.
composeBom = "2025.02.00"
googleServices = "4.5.0"
# BOM 34.x requiere Kotlin >= 2.2 (metadata 2.3); 33.16.0 es la última compatible con Kotlin 2.0
firebaseBom = "33.16.0"
ksp = "2.0.0-1.0.24"
hilt = "2.51.1"
room = "2.6.1"
retrofit = "2.11.0"
# okhttp ya llega transitivo con Retrofit; se declara para compilar contra MediaType
okhttp = "4.12.0"
kotlinxSerializationJson = "1.6.3"
ktlint = "12.1.1"
coroutinesTest = "1.8.1"
# Navegación multi-pantalla (fachada ⇄ doble fondo); Jetpack oficial y liviana (A2-1)
navigationCompose = "2.8.9"
hiltNavigationCompose = "1.2.0"
# Cifrado en reposo de la BD central (RNF-01, P-03). sqlcipher-android es el
# sucesor mantenido de android-database-sqlcipher (EOL en 4.5.4, sin parches
# desde 2023) — ver ADR en docs/ARQUITECTURA.md
sqlcipherAndroid = "4.9.0"
# Lectura de la orientación EXIF al sanear imágenes adjuntas (RF-33) y escritura
# de fixtures con GPS en los tests. Oficial, ~100 KB, sin dependencias
# transitivas y de implementación Java pura (probable en la JVM) — cumple A2-1
exifinterface = "1.3.7"
# Solo tests unitarios (no entra al APK): P-13 exige probar la capa data real
# de access (SharedPreferences) en la JVM
robolectric = "4.15.1"
androidxTestCore = "1.6.1"
# Escritura del PDF cifrado de la exportación (RF-45). Port Apache 2.0 de
# Apache PDFBox 2.0.27 sin java.awt; el cifrado AES-256 por contraseña usa solo
# javax.crypto de la plataforma, así que BouncyCastle (≈11 MB) se excluye en
# app/build.gradle.kts — ver ADR 2026-10-03 (RF-45) en docs/ARQUITECTURA.md
pdfboxAndroid = "2.0.27.0"

[libraries]
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
